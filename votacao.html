<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Votação · Sábado Letivo: Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.seg{display:flex;padding:5px;gap:4px;border-radius:99px;background:#1a0f33;border:1px solid #ffffff2a;margin:14px 0 4px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.82rem;color:var(--mut);background:none;border:0;border-radius:99px;padding:10px 4px;cursor:pointer}
.seg button[aria-selected=true]{background:linear-gradient(90deg,var(--lar),var(--rosa));color:#12082a}
.opt{padding:16px}
.opt.sel{box-shadow:0 0 0 2px var(--c),0 18px 50px -20px var(--c)}
.pos{min-height:1.3em;font-weight:800;color:var(--lima);font-size:.9rem}
.rk-row{display:flex;gap:8px;margin-top:10px}
.rk{flex:1;font:inherit;font-weight:800;font-size:1.05rem;padding:11px 4px;border-radius:14px;border:2px solid #ffffff40;background:transparent;color:var(--tx);cursor:pointer}
.rk[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#12082a}
.imgw{cursor:zoom-in}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#150a33f7;border-top:1px solid #ffffff30;box-shadow:0 -10px 40px #000a}
.bar-in{max-width:720px;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.85rem}
.slots span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmsg{min-height:1.3em;margin:4px 0 8px;font-size:.85rem;color:var(--mut)}
.bmsg.err{color:#ff8fc1;font-weight:700}
.bar .btn{width:100%}
#lb{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:12px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
.done{font-size:2.4rem}
.big-ok{--c:#c6ff3d}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
<div class="top">Sábado Letivo: Halloween · Senac Aclimação</div>
<h1 class="ttl">Votação</h1>
<div id="app"></div>
</div>
<div class="bar" id="bar" hidden></div>
<div id="lb" hidden></div>
<script src="shared.js"></script>
<script>
var CATS={
  cartaz:{e:"🎨",n:"Cartaz",c:"#ffc93c",t:"Melhor cartaz ou ilustração"},
  individual:{e:"👗",n:"Individual",c:"#ff7a1a",t:"Fantasia individual"},
  grupo:{e:"🧟",n:"Em grupo",c:"#ff3d9a",t:"Fantasia em grupo"}
};
var MED=["🥇","🥈","🥉"], ORD=["1º lugar","2º lugar","3º lugar"];
var S=null,cat=null,L={},P={},T={},EDIT={},Q="",MSG="";

function el(i){return document.getElementById(i)}
function key(p,c){return "hw_"+p+"_"+S.codigo+"_"+c}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function aberta(c){return !!(S&&S.cfg["voto_"+c])}
function enviado(c){return ld(key("s",c))}
function st(c){return T[c]||(T[c]={s:"idle",m:""})}
function nomeDe(c,id){var x=(L[c]||[]).filter(function(i){return i.id===id})[0];return x?x.titulo:"—"}

/* ---------- entrada com código ---------- */
function loginForm(){
  return '<div class="glass ins-box"><label for="cod" class="ins-l">Código do seu ingresso</label>'+
  '<div class="ins-row"><input id="cod" class="in" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">'+
  '<button class="btn" id="go">Entrar</button></div>'+(MSG?'<div class="msg err">'+esc(MSG)+'</div>':'')+
  '<p class="ins-h">O seu código garante um voto por pessoa em cada categoria.</p></div>';
}
function entrar(c){
  c=(c||"").trim(); if(!c){MSG="Digite o código do ingresso.";render();return}
  el("app").innerHTML='<div class="glass ins-box">Procurando seu código…</div>';
  api("login",{c:c}).then(function(j){
    if(j.erro){MSG=j.erro;S=null;clearCode();render();return}
    setCode(j.codigo);S=j;MSG="";
    var cs=Object.keys(CATS);
    cat=cs.filter(function(k){return aberta(k)&&!enviado(k)})[0]||cs.filter(aberta)[0]||"cartaz";
    render();
  }).catch(function(){MSG="Sem conexão. Tente de novo.";S=null;render()});
}

/* ---------- telas ---------- */
function render(){
  var app=el("app");
  if(!S){app.innerHTML=loginForm();barra();return}
  var h='<div class="glass ins-box"><div class="ins-who"><div><b>Olá, '+esc(S.nome)+'</b><br><span class="ins-s">Turma '+esc(S.turma)+'</span></div><button class="btn ghost" id="sair">Sair</button></div></div>';
  h+='<div class="seg" role="tablist" aria-label="Categorias">'+Object.keys(CATS).map(function(c){
    return '<button role="tab" data-cat="'+c+'" aria-selected="'+(c===cat)+'">'+CATS[c].e+' '+CATS[c].n+' '+(aberta(c)?(enviado(c)?'✓':'●'):'🔒')+'</button>';}).join("")+'</div><div id="body"></div>';
  app.innerHTML=h;corpo();
}

function corpo(){
  var b=el("body"),c=cat,C=CATS[c];
  if(!b)return;
  if(!aberta(c)){
    b.innerHTML='<div class="msg">A votação de <b>'+C.t+'</b> não está aberta agora. Quando abrir, ela aparece aqui sozinha.</div><button class="btn ghost" id="chk">Verificar agora</button>';
    barra();return;
  }
  var sd=enviado(c);
  if(sd&&!EDIT[c]){
    b.innerHTML='<div class="card big-ok" style="--c:#c6ff3d"><div class="done" aria-hidden="true">✅</div><h3>Voto registrado</h3><p>Recebemos o seu voto às '+esc(sd.r)+'.</p>'+
      sd.n.map(function(m,i){return '<p>'+MED[i]+' <b>'+esc(m)+'</b></p>'}).join("")+'</div>'+
      '<p class="ins-h">Mudou de ideia? Enviar de novo troca o seu voto, enquanto a votação estiver aberta. Você também pode votar nas outras categorias nas abas acima.</p>'+
      '<button class="btn ghost" id="mud" style="margin-top:10px">Mudar meu voto</button>';
    barra();return;
  }
  if(!L[c]){b.innerHTML='<div class="msg">Carregando a lista…</div>';barra();carregar(c);return}
  if(!L[c].length){b.innerHTML='<div class="msg">Ainda não há participantes cadastrados nesta categoria.</div><button class="btn ghost" id="rec">Atualizar lista</button>';barra();return}
  var h='<p class="sub">Escolha até 3: 🥇 vale 3 pontos, 🥈 vale 2 e 🥉 vale 1. Toque em uma medalha para escolher; toque de novo para tirar.</p>';
  if(L[c].length>8)h+='<input class="in txt" id="q" placeholder="Buscar por nome, personagem ou turma" value="'+esc(Q)+'" style="margin-bottom:6px">';
  h+='<div id="lst"></div><button class="btn ghost" id="rec" style="margin-top:16px">Atualizar lista</button>';
  b.innerHTML=h;lista();
}

function carregar(c){
  api("lista",{c:S.codigo,cat:c},{tries:4}).then(function(j){
    if(j.erro){
      if(j.fechada){S.cfg["voto_"+c]=false;render();return}
      el("body")&&(el("body").innerHTML='<div class="msg err">'+esc(j.erro)+'</div><button class="btn ghost" id="rec">Tentar de novo</button>');return;
    }
    L[c]=j.lista;
    var ids=j.lista.map(function(x){return x.id}),base=EDIT[c]&&enviado(c)?enviado(c).p:(ld(key("d",c))||[]);
    var p=[null,null,null];base.forEach(function(id,i){if(i<3&&ids.indexOf(id)>=0)p[i]=id});
    P[c]=p;if(c===cat)corpo();
  }).catch(function(){
    el("body")&&(el("body").innerHTML='<div class="msg err">Sem conexão para carregar a lista.</div><button class="btn ghost" id="rec">Tentar de novo</button>');
  });
}

function lista(){
  var c=cat,C=CATS[c],q=Q.toLowerCase(),h="";
  L[c].filter(function(x){return !q||(x.titulo+" "+x.nomes+" "+x.turma).toLowerCase().indexOf(q)>=0}).forEach(function(x){
    h+='<article class="card opt" data-id="'+x.id+'" style="--c:'+C.c+'"><div class="pos"></div>'+
      (c==="cartaz"?'<div class="imgw">'+imgTag(x.id,x.titulo,x.foto)+'</div>':'')+
      '<h3>'+esc(x.titulo)+'</h3><p>'+esc(x.nomes)+(x.turma?' · '+esc(x.turma):'')+'</p>'+
      '<div class="rk-row">'+MED.map(function(m,i){return '<button class="rk" data-r="'+i+'" data-id="'+x.id+'" aria-label="'+ORD[i]+'" aria-pressed="false">'+m+'</button>'}).join("")+'</div></article>';
  });
  el("lst").innerHTML=h||'<div class="msg">Nada encontrado para essa busca.</div>';
  pinta();
}

function pinta(){
  var p=P[cat]||[null,null,null];
  document.querySelectorAll("#lst .opt").forEach(function(a){
    var id=+a.dataset.id,r=p.indexOf(id);
    a.classList.toggle("sel",r>=0);
    a.querySelectorAll(".rk").forEach(function(k){k.setAttribute("aria-pressed",String(p[+k.dataset.r]===id))});
    a.querySelector(".pos").textContent=r>=0?MED[r]+" "+ORD[r]:"";
  });
  barra();
}

function escolhe(id,r){
  var c=cat,p=P[c]||(P[c]=[null,null,null]);
  if(p[r]===id)p[r]=null;
  else{var i=p.indexOf(id);if(i>=0)p[i]=null;p[r]=id}
  sv(key("d",c),p);
  var t=st(c);if(t.s==="error"||t.s==="closed"){t.s="idle";t.m=""}
  pinta();
}

/* ---------- barra de envio ---------- */
function barra(){
  var b=el("bar");
  if(!S||!cat||!aberta(cat)||!L[cat]||!L[cat].length||(enviado(cat)&&!EDIT[cat])){b.hidden=true;return}
  var c=cat,p=P[c]||[null,null,null],t=st(c);
  var any=p.some(function(x){return x!=null});
  var gap=(p[0]==null&&(p[1]!=null||p[2]!=null))||(p[1]==null&&p[2]!=null);
  var ocupado=t.s==="sending";
  var msg=t.m||(gap?"Preencha em ordem: 🥇 primeiro, depois 🥈 e 🥉.":!any?"Toque em 🥇, 🥈 ou 🥉 em um participante.":p[2]==null?"Você ainda pode escolher outros lugares.":"");
  var err=t.s==="error"||t.s==="closed"||gap;
  b.hidden=false;
  b.innerHTML='<div class="bar-in"><div class="slots">'+p.map(function(id,i){return '<span>'+MED[i]+' <b>'+esc(id==null?"—":nomeDe(c,id))+'</b></span>'}).join("")+'</div>'+
    '<div class="bmsg'+(err?' err':'')+'" aria-live="polite">'+esc(msg)+'</div>'+
    '<button class="btn" id="env"'+((!any||gap||ocupado||t.s==="closed")?' disabled':'')+'>'+(ocupado?'Enviando…':t.s==="error"?'Tentar de novo':'Enviar meu voto')+'</button></div>';
}

/* ---------- envio ---------- */
function enviar(){
  var c=cat,p=(P[c]||[]).filter(function(x){return x!=null}),t=st(c);
  if(!p.length||t.s==="sending")return;
  t.s="sending";t.m="Enviando seu voto… não feche esta página.";barra();
  var nomes=p.map(function(id){return nomeDe(c,id)});
  setTimeout(function(){ /* espalha os envios em até 5 s para não sobrecarregar o servidor */
    api("votar",{c:S.codigo,cat:c,p:p},{tries:6,onRetry:function(){t.m="Conexão instável, tentando de novo…";if(c===cat)barra()}}).then(function(j){
      if(j.ok){
        sv(key("s",c),{p:p,n:nomes,r:j.recibo});EDIT[c]=false;t.s="done";t.m="";
        if(c===cat)render();return;
      }
      if(j.encerrada){
        t.s="closed";t.m="A votação desta categoria foi encerrada antes do seu voto chegar. Ele não foi contado.";S.cfg["voto_"+c]=false;
        if(c===cat)render();return;
      }
      if(/não existe mais/.test(j.erro||"")){L[c]=null;}
      t.s="error";t.m=j.erro||"Não foi possível enviar.";if(c===cat)barra();
    }).catch(function(){
      t.s="error";t.m="Sem conexão. Seu voto ainda NÃO foi enviado. Toque para tentar de novo.";if(c===cat)barra();
    });
  },Math.random()*5000);
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button"),w=e.target.closest(".imgw");
  if(w&&!t){var im=w.querySelector("img");if(im){el("lb").innerHTML='<img alt="" src="'+im.currentSrc+'">';el("lb").hidden=false}return}
  if(e.target.closest("#lb")){el("lb").hidden=true;return}
  if(!t)return;
  if(t.id==="go")entrar(el("cod").value);
  else if(t.id==="sair"){clearCode();S=null;L={};P={};T={};render()}
  else if(t.dataset.cat){cat=t.dataset.cat;Q="";render();if(!aberta(cat))checaCfg()}
  else if(t.classList.contains("rk"))escolhe(+t.dataset.id,+t.dataset.r);
  else if(t.id==="env")enviar();
  else if(t.id==="mud"){EDIT[cat]=true;L[cat]=null;corpo()}
  else if(t.id==="rec"){L[cat]=null;corpo()}
  else if(t.id==="chk")checaCfg(true);
});
document.addEventListener("input",function(e){if(e.target.id==="q"){Q=e.target.value;lista()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="cod")entrar(e.target.value)});

/* verifica se alguma votação abriu ou fechou (consulta leve, só com a aba aberta) */
function checaCfg(manual){
  if(!S)return;
  api("cfg",{}).then(function(j){
    if(!j.ok)return;
    if(JSON.stringify(j.cfg)!==JSON.stringify(S.cfg)){S.cfg=j.cfg;render()}
    else if(manual){var b=el("body");if(b)b.insertAdjacentHTML("beforeend",'<p class="ins-h">Ainda não abriu. Fique de olho no telão.</p>')}
  }).catch(function(){});
}
setInterval(function(){if(S&&!document.hidden&&cat&&!aberta(cat))checaCfg()},45000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S)checaCfg()});

var c0=getCode();
if(c0)entrar(c0);else render();
</script>
</body>
</html>
